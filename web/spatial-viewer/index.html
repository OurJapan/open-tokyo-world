<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="カメラと3D表示を試し、現実の気づきを写真と一緒に手元へ保存するOpen Tokyo Worldの実験ビューア。" />
  <meta name="referrer" content="no-referrer" />
  <title>Open Tokyo World</title>
</head>
<body>
<div id="app">
  <header><a class="brand" href="./" aria-label="Open Tokyo World ホーム">Open Tokyo World</a><span class="pill">Preview</span></header>
  <main>
    <section class="workspace" aria-labelledby="viewer-title">
      <div class="workspace-heading"><div><h1 id="viewer-title">東京タワー周辺</h1></div><button id="reset-view" class="quiet">視点を戻す</button></div>
      <div id="stage" class="stage">
        <video id="camera" playsinline muted autoplay aria-label="背面カメラ映像" hidden></video>
        <div id="canvas-host" aria-label="3D検証モデル。ドラッグで回転、ピンチで拡大"></div>
        <div class="stage-label"><span id="mode-label">3Dビュー</span></div>

        <div class="model-caption"><span>サンプルモデル · 実際の建物とは異なります</span></div>
        <div id="loading" role="status">3Dモデルを読み込んでいます…</div>
      </div>

      <p id="notice" class="notice" role="status" aria-live="polite">ドラッグで回転、ピンチで拡大できます。</p>
      <div class="actions"><button id="start" class="primary">カメラを開く</button><button id="stop" hidden>カメラを終了</button><button id="capture" disabled>写真を撮る</button></div>
    </section>
    <aside class="panel" aria-label="表示と観測">
      <section><h2>表示設定</h2>
        <label for="placement">表示位置</label><select id="placement"><option value="device-test">目の前に表示</option><option value="geo">現在地に合わせる（周辺のみ）</option></select>
        <p class="help" id="placement-help">カメラ前方に仮配置します。実際の位置とは一致しません。</p>
        <label for="opacity">モデルの濃さ <output id="opacity-label">75%</output></label><input id="opacity" type="range" min="0" max="100" value="75" />
        <label for="radius">表示範囲</label><select id="radius"><option value="50">50 m</option><option value="100" selected>100 m</option><option value="300">300 m</option></select>

      </section>
      <p class="privacy-note">写真と位置情報は端末に保存されます。外部には送信されません。</p>
      <details><summary>接続情報</summary>      <div class="sensor-strip"><span>カメラ <b id="camera-status">停止中</b></span><span>位置 <b id="location-status">未取得</b></span><span>方位 <b id="orientation-status">未取得</b></span></div><pre id="diagnostics">準備中</pre><p class="help">表示位置は概算です。自動の位置補正には対応していません。</p></details>
    </aside>
  </main>

</div>
<dialog id="draft-dialog" aria-labelledby="draft-title"><form id="draft-form">
  <div class="dialog-heading"><div><h2 id="draft-title">写真にメモを追加</h2></div><button type="button" id="close-draft" aria-label="下書きを閉じる">×</button></div>
  <img id="photo-preview" alt="撮影した生写真。3Dモデルは含まれません" />
  <p id="capture-summary" class="help"></p>
  <label for="observation-type">何を記録しますか？</label><select id="observation-type"><option value="reality_difference">現実と違う</option><option value="addition">Worldに追加したい</option><option value="outdated">情報が古い</option><option value="digital_correction">デジタル側を修正したい</option><option value="no_issue">問題なし・確認した</option></select>
  <label for="description">メモ（任意）</label><textarea id="description" rows="3" maxlength="2000" placeholder="例：入口の屋根がモデルと違うように見える"></textarea>
  <p class="help">写真と撮影情報をZIPで保存します。位置情報を含むため、共有前に内容をご確認ください。</p>
  <p id="draft-status" role="status" aria-live="polite">下書き</p>
  <div class="actions"><button type="submit" id="save-draft" class="primary">写真とメモを保存</button><button type="button" id="delete-draft">下書きを削除</button></div>
</form></dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
