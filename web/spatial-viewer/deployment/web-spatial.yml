# Installation template: maintainer copies to .github/workflows/web-spatial.yml.
name: Web spatial viewer
on:
  pull_request:
    paths: ['web/spatial-viewer/**', 'adapters/open-tokyo-world/**', '.github/workflows/web-spatial.yml']
  push:
    paths: ['web/spatial-viewer/**', 'adapters/open-tokyo-world/**', '.github/workflows/web-spatial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/spatial-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../../adapters/open-tokyo-world/build_web_fixture.py
      - run: git diff --exit-code -- public/data
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-spatial-static
          path: web/spatial-viewer/dist
          retention-days: 7
