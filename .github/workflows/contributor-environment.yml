name: Contributor environment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/contributor-environment.yml'
      - 'tests/contributor_*.py'
      - 'scripts/workspace*.py'
      - 'scripts/district_distribution.py'
      - 'scripts/mori_*.py'
      - 'manifests/contributor-workspace.json'
      - 'manifests/district-distribution.json'
      - 'starter/mori/**'
      - 'starter/plateau/**'
      - 'starter/plaza/scene.py'
permissions:
  contents: read
jobs:
  public-onboarding:
    name: Public onboarding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archive: blender-4.5.1-linux-x64.tar.xz
            sha256: 085a7ed4ed80c3cb66783bad76f236f39897de5d33884abd133e0c6db94c0f14
            executable: blender-4.5.1-linux-x64/blender
          - os: windows-2022
            archive: blender-4.5.1-windows-x64.zip
            sha256: ae2eadb2656d710ffd6ca74a899519fccb800c7a18e6c05b6f39627e48d17aed
            executable: blender-4.5.1-windows-x64/blender.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libgl1 libegl1 libglib2.0-0
      - name: Fetch the pinned official Blender archive
        shell: python
        env:
          BLENDER_ARCHIVE: ${{ matrix.archive }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
        run: |
          import hashlib, os, pathlib, shutil, tarfile, urllib.request, zipfile
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'otw-blender'
          folder.mkdir()
          archive = folder / os.environ['BLENDER_ARCHIVE']
          url = 'https://mirror.blender.org/release/Blender4.5/' + archive.name
          request = urllib.request.Request(url, headers={'User-Agent': 'OpenTokyoWorld/1.0 (contributor verification)'})
          with urllib.request.urlopen(request, timeout=120) as response, archive.open('xb') as output:
              if not response.geturl().startswith('https://'):
                  raise ValueError('Blender mirror must use HTTPS')
              print('Official mirror:', response.geturl())
              shutil.copyfileobj(response, output, 1024 * 1024)
          with archive.open('rb') as handle:
              actual = hashlib.file_digest(handle, 'sha256').hexdigest()
          if actual != os.environ['BLENDER_SHA256']:
              raise ValueError('Official Blender archive checksum mismatch')
          if archive.suffix == '.zip':
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(folder)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(folder, filter='data')
      - name: Public setup, CPU rendering, edit, save and reopen
        shell: python
        env:
          BLENDER_EXECUTABLE: ${{ matrix.executable }}
        run: |
          import os, pathlib, subprocess, sys
          blender = pathlib.Path(os.environ['RUNNER_TEMP']) / 'otw-blender' / os.environ['BLENDER_EXECUTABLE']
          subprocess.run([sys.executable, 'tests/contributor_smoke.py', '--blender', str(blender),
                          '--output', 'build/contributor-ci'], check=True, timeout=1300)
      - name: Retain verification records only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contributor-${{ matrix.os }}
          path: |
            build/contributor-ci/report.json
            build/contributor-ci/edit-result.json
            build/contributor-ci/logs/*.log
          if-no-files-found: warn
          retention-days: 14
