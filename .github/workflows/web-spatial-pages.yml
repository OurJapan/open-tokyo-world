name: Publish web spatial viewer to Pages
# Intentional manual release after review, never on PR or arbitrary pushes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-spatial-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/spatial-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_OBSERVATION_API_URL: ${{ vars.OBSERVATION_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/spatial-viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
