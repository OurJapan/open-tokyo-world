name: Web spatial viewer
on:
  pull_request:
    paths: ['web/**', 'adapters/open-tokyo-world/**', '.github/workflows/web-spatial.yml']
  push:
    paths: ['web/**', 'adapters/open-tokyo-world/**', '.github/workflows/web-spatial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/spatial-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../../adapters/open-tokyo-world/build_web_fixture.py
      - run: git diff --exit-code -- public/data
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test ../observation-api/tests/*.test.mjs
      - run: python -m unittest discover -s ../observation-api/tests -p "test_*.py"
      - run: pnpm --dir ../observation-api install --frozen-lockfile
      - run: pnpm --dir ../observation-api check:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: pnpm build
        env:
          VITE_OBSERVATION_API_URL: https://otw-observation-api.open-tokyo-world-observation-api.workers.dev
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify field capture, offline storage and retry
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4181 &
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: web-spatial-static
          path: web/spatial-viewer/dist
          retention-days: 7
