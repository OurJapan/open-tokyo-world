name: 街の違い・改善を報告する
description: 建物名や地図リンク、一言から参加できます。
title: "[街の改善] "
body:
  - type: markdown
    attributes:
      value: |
        Blenderやプログラミングの知識は不要です。運営とAIが調査します。完全自動の修正受付ではありません。
        写真は公開してよいものだけを添付してください。他者の資料はURLだけでも役立ちます。参考資料の紹介を、Textureや配布素材としての利用許諾とは扱いません。
  - type: input
    id: location
    attributes:
      label: どこの場所ですか？
      description: 建物名、地図リンク、動画の時刻などで構いません。
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 何が違いますか？ どう改善したいですか？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 写真・資料・見た時期（分かる範囲で）
      description: 写真の撮影日、見た方向、資料URL。写真を添付する場合は撮影者と利用できる範囲も記載してください。
  - type: dropdown
    id: credit
    attributes:
      label: 貢献者紹介へのお名前の掲載
      description: 公開Issueのアカウント表示は残ります。ライセンス上必要な作者・出典表示とは別の希望です。
      options:
        - 希望しない
        - GitHubの表示名で掲載してよい
        - 掲載前に相談したい
      default: 0
